[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice"
version = "0.13.1-beta.3"
description = "An open-source virtual audio mixer for PipeWire on Linux: channels, per-output mixes and VST3 effects"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
    # PySide6 6.12.0 has a reference-counting bug on Python 3.10 and 3.11 (each call that returns nothing drops a reference to
    # None, and Python eventually aborts). It is fine on 3.12 and newer, and 6.11 is fine everywhere.
    "PySide6-Essentials>=6.5,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.5; python_version >= '3.12'",
    "pulsectl>=23.5",
    "numpy>=1.24",
    "pedalboard>=0.9",
    "JACK-Client>=0.5",
    "cryptography>=3.1",  # 0.13.1: checks the minisign signature on updates (Ed25519)
]

[project.urls]
Homepage = "https://github.com/Matt-B-007/Sluice"
Issues = "https://github.com/Matt-B-007/Sluice/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes"]

[project.scripts]
sluice = "sluice.__main__:run"

[tool.setuptools]
packages = ["sluice", "sluice.data", "sluice.data.png", "sluice.data.fonts"]

[tool.setuptools.package-data]
sluice = ["data/*.svg", "data/png/*.png", "data/*.md", "data/fonts/*.ttf", "data/fonts/*.txt", "data/icons/*.svg", "data/icons/LICENSE", "data/icons/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 0.12.4: the tests always use the Sluice in this folder, also when it is not installed (StowLock runs pytest without the
# "pip install -e" step) and when another copy is installed for the same Python.
pythonpath = ["."]

# 0.13.1: the Python formatter. "ruff format" lays every file out the same way; scripts/check.sh fails on a file it would change.
# The version is pinned in scripts/tool-versions. The line length matches how the code was already written.
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["themes", "rust"]

[tool.ruff.format]
quote-style = "double"
