name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:    # Actions > Release > Run workflow: releases the version in the code, making its tag for you
permissions:
  contents: write
  id-token: write       # for the build attestation below
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Work out the tag (from the version in the code when run by hand)
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v$(python tools/check-version.py --print)"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check the version files, the changelogs and the tag agree
        run: python tools/check-version.py --tag "$TAG" --new  # --new: newer than every release so far (0.12.3)
      - name: Make the tag (run by hand only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Set a new version first (tools/release.sh --set <next version>), commit and push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Sluice ${TAG#v}"
          git push origin "$TAG"
      - name: Build
        run: |
          pip install build
          python -m build
          mkdir -p out
          git archive --prefix=sluice/ -o "out/sluice-${TAG}.zip" HEAD
          # The in-app updater downloads this file next to the zip and refuses a zip that does not match it.
          (cd out && sha256sum "sluice-${TAG}.zip" > "sluice-${TAG}.zip.sha256")
      - name: Attest where the files came from (GitHub build provenance; a failure here never stops the release)
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/*.zip
            dist/*
      - name: Release notes from the changelog
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section '## $v': add one before tagging"; exit 1; }
          # A test version (0.13.0-beta.1, 1.0.0-rc.1) is a pre-release: only the Beta channel and get.sh --beta take it.
          # Every other version is a normal release, which the Stable channel and the one-line installer install.
          case "$v" in
            *-*) echo "title=Sluice $v (test version)"; echo "prerelease=true" ;;
            *)   echo "title=Sluice $v"; echo "prerelease=false" ;;
          esac >> "$GITHUB_OUTPUT"
        id: notes
      # 0.12.3: the release is made as a draft with every file attached, then published in a separate step. With GitHub's
      # "immutable releases" setting on, files can no longer be attached once a release is published, and either way no one
      # can see (or be offered) a release before its zip and checksum are there.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          draft: true
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: |
            dist/*
            out/*.zip
            out/*.sha256
      - name: Check the draft has its zip and checksum, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for need in "sluice-${TAG}.zip" "sluice-${TAG}.zip.sha256"; do
            echo "$assets" | grep -qx "$need" || { echo "::error::The release is missing $need, so it was left as a draft."; exit 1; }
          done
          latest=true
          [ "${{ steps.notes.outputs.prerelease }}" = "true" ] && latest=false
          gh release edit "$TAG" --draft=false --latest="$latest"
          echo "Published Sluice ${TAG#v}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
