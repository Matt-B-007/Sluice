name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"',open('sluice/__init__.py').read()).group(1))")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Build
        run: |
          pip install build
          python -m build
          mkdir -p out
          git archive --prefix=sluice/ -o "out/sluice-${GITHUB_REF_NAME}.zip" HEAD
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}  # every 0.x version is a beta
          files: |
            dist/*
            out/*.zip
