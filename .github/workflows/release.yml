name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:    # Actions > Release > Run workflow: releases the version in the code, making its tag for you
permissions:
  contents: write
  id-token: write       # for the build attestation below
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 0.13.1 (House Standard): stop before anything is made when the signing key is not set up
      - name: Check the signing key secret is set (MINISIGN_SECRET_KEY)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::The repository secret MINISIGN_SECRET_KEY is not set, so the release cannot be signed. Nothing was made."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Work out the tag (from the version in the code when run by hand)
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v$(python tools/check-version.py --print)"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Install pyflakes, the pinned shellcheck and the pinned ruff (versions in scripts/tool-versions)
        run: |
          . scripts/tool-versions
          pip install pyflakes "shellcheck-py==$SHELLCHECK_PY" "ruff==$RUFF_VERSION"
      # 0.12.5: the same checks as CI, from the same script; then the tag must match and be newer than every release
      - name: Check shell scripts, Python, the version files and the tag (scripts/check.sh shell python release)
        run: bash scripts/check.sh shell python release
      - name: Make the tag (run by hand only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Set a new version first (tools/release.sh --set <next version>), commit and push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Sluice ${TAG#v}"
          git push origin "$TAG"
      - name: Build
        run: |
          pip install build
          python -m build
          mkdir -p out
          git archive --prefix=sluice/ -o "out/sluice-${TAG}.zip" HEAD
          # The in-app updater downloads this file next to the zip and refuses a zip that does not match it.
          (cd out && sha256sum "sluice-${TAG}.zip" > "sluice-${TAG}.zip.sha256")
          # 0.13.1: one list of every file's checksum (the House Standard's SHA256SUMS); both lists are signed below
          (cd out && sha256sum "sluice-${TAG}.zip") > out/SHA256SUMS
          (cd dist && sha256sum -- *) >> out/SHA256SUMS
      - name: Install minisign
        run: sudo apt-get update -q && sudo apt-get install -y minisign
      - name: Sign SHA256SUMS and the zip's checksum file with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          status=0
          for file in out/SHA256SUMS "out/sluice-${TAG}.zip.sha256"; do
            minisign -S -s "$key" -m "$file" -t "Sluice ${TAG}" < /dev/null || status=$?
          done
          rm -f "$key"
          if [ "$status" -ne 0 ]; then
            echo "::error::minisign could not sign the release. 'Error while loading the secret key file' means the secret's contents are wrong (it must be the unencrypted two-line key file)."
            exit 1
          fi
      - name: Check both signatures against Sluice's public keys (primary or backup)
        run: |
          primary=RWQcs3jtP2jTiAMafwQX8UwciSjOH4o9tQcCVvYl2NkdnOeVupKPlhvC
          backup=RWRObC9qlP598z1kmTFw7W+TKYKk3w2/63qWyRWkvRSkqGwGEgjmOlGe
          for file in out/SHA256SUMS "out/sluice-${TAG}.zip.sha256"; do
            if minisign -Vm "$file" -P "$primary" >/dev/null || minisign -Vm "$file" -P "$backup" >/dev/null; then
              echo "$file: good signature"
            else
              echo "::error::$file is not signed by Sluice's primary or backup key. Nothing was published."
              exit 1
            fi
          done
          # the app carries the same two keys
          python - <<'PY'
          from sluice import signing
          assert signing.PUBLIC_KEYS == {"primary": "RWQcs3jtP2jTiAMafwQX8UwciSjOH4o9tQcCVvYl2NkdnOeVupKPlhvC",
                                         "backup": "RWRObC9qlP598z1kmTFw7W+TKYKk3w2/63qWyRWkvRSkqGwGEgjmOlGe"}, "keys differ"
          PY
      - name: Attest where the files came from (GitHub build provenance; public repositories only)
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/*.zip
            dist/*
      - name: Release notes from the changelog
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section '## $v': add one before tagging"; exit 1; }
          # A test version (0.13.0-beta.1, 1.0.0-rc.1) is a pre-release: only the Beta channel and get.sh --beta take it.
          # Every other version is a normal release, which the Stable channel and the one-line installer install.
          case "$v" in
            *-*) echo "title=Sluice $v (test version)"; echo "prerelease=true" ;;
            *)   echo "title=Sluice $v"; echo "prerelease=false" ;;
          esac >> "$GITHUB_OUTPUT"
        id: notes
      # 0.12.3: the release is made as a draft with every file attached, then published in a separate step. With GitHub's
      # "immutable releases" setting on, files can no longer be attached once a release is published, and either way no one
      # can see (or be offered) a release before its zip and checksum are there.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          draft: true
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: |
            dist/*
            out/*.zip
            out/*.sha256
            out/SHA256SUMS
            out/*.minisig
      - name: Check the draft has its zip and checksum, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for need in "sluice-${TAG}.zip" "sluice-${TAG}.zip.sha256" "sluice-${TAG}.zip.sha256.minisig" SHA256SUMS SHA256SUMS.minisig; do
            echo "$assets" | grep -qx "$need" || { echo "::error::The release is missing $need, so it was left as a draft."; exit 1; }
          done
          latest=true
          [ "${{ steps.notes.outputs.prerelease }}" = "true" ] && latest=false
          gh release edit "$TAG" --draft=false --latest="$latest"
          echo "Published Sluice ${TAG#v}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
      # 0.12.5: a failed release says plainly whether it left anything to tidy up (House Standard 1.2: releases fail closed)
      - name: Say whether a draft release or a tag was left behind
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${TAG:-}" ]; then
            echo "The release stopped before it had a tag: nothing was made, nothing to delete."
            exit 0
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            echo "::error::A DRAFT release $TAG was left behind (no one can see it). Delete it on the Releases page, or: gh release delete $TAG"
          else
            echo "No draft release was left behind."
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::This run made the tag $TAG. Delete it before trying again: git push --delete origin $TAG"
          fi
