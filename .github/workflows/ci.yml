name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt (offscreen) and audio
        timeout-minutes: 8
        continue-on-error: true
        run: |
          # Install only what the runner image lacks. If Ubuntu's own servers are unreachable (this has happened),
          # switch to a public mirror. A failure here never stops the run: the tests report it if a library is truly missing.
          missing=""
          for pkg in libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -z "$missing" ]; then
            echo "All system libraries are already installed."
            exit 0
          fi
          echo "Missing:$missing"
          apt_opts="-o Acquire::Retries=0 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8"
          try_install() {
            timeout "$1" sudo apt-get $apt_opts update && timeout "$2" sudo apt-get $apt_opts install -y $missing
          }
          # 0.12.1: three tries on each mirror, 20 s apart (a server that does not answer once often does a moment later)
          installed=0
          for attempt in 1 2 3; do
            if try_install 60 60; then installed=1; echo "Installed from the default mirror."; break; fi
            echo "Default mirror failed (try $attempt of 3)"; sleep 20
          done
          if [ "$installed" = 0 ]; then
            echo "Trying mirrors.edge.kernel.org"
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://mirrors.edge.kernel.org/ubuntu/#g; s#http://azure.archive.ubuntu.com/ubuntu/\?#http://mirrors.edge.kernel.org/ubuntu/#g; s#https\?://\(security\|archive\)\.ubuntu\.com/ubuntu/\?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            for attempt in 1 2 3; do
              if try_install 90 120; then echo "Installed from the fallback mirror."; break; fi
              echo "Fallback mirror failed (try $attempt of 3)"; sleep 20
            done
          fi
          echo "Still missing:"
          for pkg in $missing; do dpkg -s "$pkg" >/dev/null 2>&1 || echo "  $pkg"; done
          true
      - name: Install Sluice and its test tools
        run: pip install -e ".[dev]"
      # 0.12.5: every check is in scripts/check.sh, so a check run on a computer and one run here cannot differ
      - name: Run the tests (scripts/check.sh tests; Qt libraries check, then pytest)
        run: bash scripts/check.sh tests
  rust:
    # The same tests with the Rust engine built, against a dummy JACK server; the job above runs them without Rust.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/sluice_dsp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/sluice_dsp/Cargo.lock') }}
      - name: Audio tools for the JACK test (a failure here only skips that test)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # The runner's package lists can be stale or its default mirror unreachable, so: refresh and install, then try a public mirror.
          pkgs="jackd2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0"
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          if sudo apt-get $opts update && sudo apt-get $opts install -y --no-install-recommends $pkgs; then
            echo "Installed."
          else
            echo "Default mirror failed; trying mirrors.edge.kernel.org"
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://mirrors.edge.kernel.org/ubuntu/#g; s#http://azure.archive.ubuntu.com/ubuntu/\?#http://mirrors.edge.kernel.org/ubuntu/#g; s#https\?://\(security\|archive\)\.ubuntu\.com/ubuntu/\?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sudo apt-get $opts update && sudo apt-get $opts install -y --no-install-recommends $pkgs
          fi
      - name: Install the pinned Rust toolchain with rustfmt and clippy (rust/sluice_dsp/rust-toolchain.toml)
        run: |
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/sluice_dsp/rust-toolchain.toml)"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - name: Install Sluice, its test tools and maturin
        run: pip install -e ".[dev]" maturin
      - name: Build and install the Rust engine
        run: cd rust/sluice_dsp && maturin build --release -o ../../dist && pip install ../../dist/sluice_dsp-*.whl
      - name: Check the Rust code and run the tests with and without the Rust engine (scripts/check.sh rust tests)
        env:
          SLUICE_EXPECT_RUST: "1"
        run: bash scripts/check.sh rust tests
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pyflakes and the pinned shellcheck (version in scripts/tool-versions)
        run: |
          . scripts/tool-versions
          pip install pyflakes "shellcheck-py==$SHELLCHECK_PY"
      - name: Check shell scripts (bash -n + shellcheck), Python (pyflakes) and the version files (scripts/check.sh shell python)
        run: bash scripts/check.sh shell python
